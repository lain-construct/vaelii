version: 2

# GitHub Actions only. The Clojure dependencies are tracked by `lein antq`, which
# writes docs/dependencies.md and the deps badge (scripts/update-badges.sh --deps)
# — Dependabot has no Leiningen ecosystem, so pointing it at project.clj would do
# nothing quietly. Actions is the half it does cover, and the half where a stale
# pin is a supply-chain question rather than a version question: every workflow
# here runs on fork pull requests.
#
# No `target-branch:`, so a bump PR is based on the repository's default branch
# and merges there. The key is resolved against the branches the repository
# actually has, and one naming a branch that is absent opens nothing and reports
# nothing — so it belongs only in a copy of this file sitting beside the branch
# it names.
#
# One group holding every action, so a cycle opens one pull request rather than
# one per action: they bump together, read together, and a single dispatch of
# test.yml answers for all of them at once. Weekly, because the release cut falls
# on no fixed day and the carve ships the workflows at `HEAD` — whatever the last
# scan found is what a release names as its supply chain.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
